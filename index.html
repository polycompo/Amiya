<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>근무 이력 · 프론트엔드 개발자, AI와 함께 일하다</title>
  </head>
  <body>
    <div id="readiness" class="readiness" role="dialog" aria-label="발표 시작" aria-modal="true" aria-busy="true" tabindex="-1">
      <div class="readiness-content">
        <div id="loading-battery" class="battery-meter" role="progressbar" aria-label="발표 자료 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="battery-cell"></span><span class="battery-cell"></span><span class="battery-cell"></span><span class="battery-cell"></span><span class="battery-cell"></span><span class="battery-cell"></span><span class="battery-cell"></span>
        </div>
        <span id="loading-percent" class="loading-percent" aria-hidden="true">0%</span>
        <p id="readiness-status" class="sr-only" role="status">발표 자료 준비 중</p>
      </div>
    </div>
    <div id="career-origin" class="career-origin" role="dialog" aria-label="진로 선택 이야기" aria-modal="true" data-origin-stage="idle" tabindex="-1" hidden>
      <div class="origin-scene">
        <button id="computer-choice" class="origin-choice origin-choice-computer" type="button" aria-label="컴퓨터를 선택합니다">
          <span class="origin-choice-icon origin-monitor" aria-hidden="true">
            <svg viewBox="0 0 120 108" focusable="false">
              <rect x="9" y="8" width="102" height="70" rx="8"></rect>
              <path d="M44 99h32M60 78v21"></path>
              <path class="monitor-glow" d="M23 22h74v42H23z"></path>
            </svg>
          </span>
        </button>

        <div class="origin-character-stage">
          <div class="origin-facts" aria-hidden="true">
            <span class="origin-fact origin-gpa"><span id="origin-gpa">3.26</span></span>
            <span class="origin-fact origin-gamepad" aria-label="컴퓨터 게임을 좋아함">
              <svg viewBox="0 0 96 64" focusable="false">
                <path d="M28 14h40c11 0 17 8 20 20l3 13c2 9-8 15-14 8L66 44H30L19 55c-6 7-16 1-14-8l3-13c3-12 9-20 20-20Z"></path>
                <path d="M25 25v14M18 32h14M65 29h.1M76 37h.1"></path>
              </svg>
            </span>
          </div>
          <div id="origin-character" class="origin-character" aria-hidden="true">
            <img id="origin-character-image" alt="" draggable="false" />
          </div>
          <button id="graduation-cap" class="graduation-cap" type="button" aria-label="학사모를 눌러 진로 선택을 봅니다">
          </button>
        </div>

        <button id="major-choice" class="origin-choice origin-choice-major" type="button" aria-label="전공 살리기를 선택합니다">
          <span class="origin-choice-icon" aria-hidden="true">
            <svg viewBox="0 0 120 108" focusable="false">
              <path d="M48 10h24M53 10v30L27 82c-5 9 1 16 11 16h44c10 0 16-7 11-16L67 40V10"></path>
              <path class="flask-fill" d="M37 77h46l10 16H27l10-16Z"></path>
              <circle cx="47" cy="69" r="4"></circle><circle cx="67" cy="78" r="5"></circle>
            </svg>
          </span>
        </button>
      </div>
      <p id="origin-announcement" class="sr-only" role="status" aria-live="polite">학사모를 눌러 이야기를 시작하세요.</p>
    </div>
    <main class="reveal" aria-label="발표 자료" inert>
      <div class="slides">
        <section id="career" class="career-slide" data-stage="0" aria-label="근무 이력 지도">
          <div class="slide-topline">
            <span class="date-range">2016 <span aria-hidden="true">-</span> 현재</span>
            <span class="map-key"><span class="key-pin" aria-hidden="true"></span> 근무지 <span class="key-area" aria-hidden="true"></span> 활동 지역</span>
          </div>
          <div id="career-map" class="map-container"></div>
          <div class="history-panel" aria-label="근무 이력">
            <article class="history-entry fragment" data-fragment-index="0" data-history="1">
              <div class="history-meta"><span class="history-index">01</span><time>2016.11 - 2019.07</time></div>
              <div class="history-heading"><h2>Exntu</h2><span class="history-note">첫 근무</span></div>
            </article>
            <article class="history-entry fragment" data-fragment-index="1" data-history="2">
              <div class="history-meta"><span class="history-index">02</span><time>2019.08 - 2020.05</time></div>
              <div class="history-heading"><h2>KINX</h2></div>
            </article>
            <article class="history-entry fragment" data-fragment-index="2" data-history="3">
              <div class="history-meta"><span class="history-index">03</span><time>2020.05 - 현재</time></div>
              <div class="history-heading"><h2>프리랜서</h2><span class="current-badge">현재</span></div>
            </article>
          </div>
          <footer class="slide-footer">
            <span aria-hidden="true"></span>
            <nav class="presentation-controls" aria-label="발표 조작">
              <button id="reset" type="button" aria-label="연혁 처음부터">↺ <span>처음부터</span></button>
              <span class="controls-divider" aria-hidden="true"></span>
              <button id="previous" type="button" aria-label="이전 근무 이력">←</button>
              <span id="step-count" class="step-count" aria-live="off">00 / 03</span>
              <button id="next" type="button" aria-label="다음 근무 이력">→</button>
            </nav>
          </footer>
          <aside class="notes">2016년 11월 판교의 Exntu에서 처음 근무했습니다. 2019년 8월에는 강남의 KINX로 옮겼고, 2020년 5월부터 지금까지는 주로 분당에서 프리랜서로 일하고 있습니다. 현재 하는 프론트엔드 업무 소개로 이어갑니다.</aside>
        </section>
      </div>
    </main>
    <p id="career-announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript>이 발표는 JavaScript를 사용합니다. 전체 이력은 함께 제공된 PDF에서 확인할 수 있습니다.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
