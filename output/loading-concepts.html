<style>
  @font-face { font-family: 'Loading Wanted'; font-style: normal; font-weight: 400 1000; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@02c9b822349c188ada95f9e2d90c2ed18f853235/packages/wanted-sans/fonts/webfonts/variable/complete/woff2/WantedSansVariable.woff2') format('woff2'); }
  #opening-loading-concepts { --loader-blue: #2864df; --loader-ink: #172235; --loader-paper: #f8f9fb; --loader-soft: #e3eaf4; font-family: 'Loading Wanted', sans-serif; color: var(--loader-ink); }
  #opening-loading-concepts * { box-sizing: border-box; }
  #opening-loading-concepts [hidden] { display: none !important; }
  #opening-loading-concepts button { font: inherit; cursor: pointer; }
  #opening-loading-concepts .concept-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  #opening-loading-concepts .concept-button { border: 1px solid #dce2ec; padding: 11px 8px; border-radius: 9px; background: #fff; color: #647187; font-size: 13px; font-weight: 600; line-height: 1.35; min-height: 44px; }
  #opening-loading-concepts .concept-button[aria-pressed='true'] { background: var(--loader-ink); color: #fff; border-color: var(--loader-ink); }
  #opening-loading-concepts .preview { position: relative; background: var(--loader-paper); aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #e2e7ef; border-radius: 14px; min-height: 320px; }
  #opening-loading-concepts .loading-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #opening-loading-concepts .art { height: 118px; width: min(340px, 88%); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; position: relative; }
  #opening-loading-concepts .battery { width: 200px; height: 90px; padding: 9px; border: 3px solid var(--loader-blue); border-radius: 19px; position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  #opening-loading-concepts .battery::after { content: ''; position: absolute; top: 27px; right: -11px; height: 28px; width: 6px; border-radius: 0 4px 4px 0; background: var(--loader-blue); }
  #opening-loading-concepts .battery span { background: var(--loader-soft); border-radius: 6px; transition: background 140ms ease; }
  #opening-loading-concepts .battery span.is-filled { background: var(--loader-blue); }
  #opening-loading-concepts .pin-ground { position: absolute; width: 155px; height: 51px; border: 1px solid #ccd9ee; border-radius: 50%; bottom: 2px; transform: scale(var(--ground-scale, .65)); opacity: var(--ground-opacity, .3); }
  #opening-loading-concepts .pin-ground::after { content: ''; position: absolute; inset: 10px 30px; border: 1px solid #b5caed; border-radius: 50%; }
  #opening-loading-concepts .pin-mark { position: relative; z-index: 1; color: var(--loader-blue); display: grid; place-items: center; width: 16px; height: 16px; transform: translateY(var(--pin-offset, -22px)) scale(4); transform-origin: center bottom; opacity: var(--pin-opacity, .15); }
  #opening-loading-concepts .timeline { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; position: relative; padding-top: 20px; }
  #opening-loading-concepts .timeline::before { content: ''; position: absolute; height: 2px; top: 30px; left: 16.667%; right: 16.667%; background: var(--loader-soft); }
  #opening-loading-concepts .timeline-line { position: absolute; height: 2px; top: 30px; left: 16.667%; width: 66.666%; transform: scaleX(var(--timeline-progress, 0)); transform-origin: left; background: var(--loader-blue); }
  #opening-loading-concepts .timeline-stop { display: flex; flex-direction: column; align-items: center; position: relative; color: #a4afbf; transition: color 180ms; }
  #opening-loading-concepts .timeline-dot { width: 22px; height: 22px; border: 5px solid var(--loader-paper); background: #cfd8e5; border-radius: 50%; margin-bottom: 15px; transition: background 180ms; }
  #opening-loading-concepts .timeline-stop.is-active { color: var(--loader-ink); }
  #opening-loading-concepts .timeline-stop.is-active .timeline-dot { background: var(--loader-blue); box-shadow: 0 0 0 1px #c9d8f3; }
  #opening-loading-concepts .timeline-year { font-size: 19px; font-weight: 700; line-height: 1.25; }
  #opening-loading-concepts .timeline-place { font-size: 12px; margin-top: 7px; font-weight: 500; }
  #opening-loading-concepts .minimal { width: 260px; }
  #opening-loading-concepts .big-number { font-size: 76px; line-height: 1; font-weight: 550; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
  #opening-loading-concepts .big-number small { font-size: 21px; letter-spacing: 0; margin-left: 6px; color: #8793a6; }
  #opening-loading-concepts .minimal-track { height: 3px; width: 100%; background: var(--loader-soft); margin-top: 23px; overflow: hidden; }
  #opening-loading-concepts .minimal-fill { height: 100%; background: var(--loader-blue); transform: scaleX(var(--loading-progress, 0)); transform-origin: left; }
  #opening-loading-concepts .status-line { margin: 0 0 24px; font-size: 15px; font-weight: 500; line-height: 1.5; color: #748298; display: flex; align-items: baseline; gap: 12px; }
  #opening-loading-concepts .percent { color: var(--loader-blue); font-variant-numeric: tabular-nums; min-width: 36px; }
  #opening-loading-concepts .start-control { border: 0; border-radius: 9px; min-width: 126px; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 0 18px; background: var(--loader-blue); color: #fff; font-size: 15px; font-weight: 600; transition: opacity 180ms, transform 180ms; }
  #opening-loading-concepts .start-control:disabled { opacity: 0; transform: translateY(7px); pointer-events: none; }
  #opening-loading-concepts .start-control svg { width: 17px; height: 17px; }
  #opening-loading-concepts .map-destination { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--loader-paper); animation: loader-map-arrive 320ms ease both; }
  #opening-loading-concepts .preview-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  #opening-loading-concepts .selected-label { font-size: 13px; line-height: 1.4; color: #6d7b90; }
  #opening-loading-concepts .replay { border: 1px solid #dce2ec; border-radius: 7px; background: #fff; color: #374761; min-height: 38px; padding: 8px 13px; font-size: 13px; font-weight: 550; white-space: nowrap; }
  @keyframes loader-map-arrive { from { opacity: 0; transform: scale(1.015); } to { opacity: 1; transform: scale(1); } }
  @media (max-width: 480px) {
    #opening-loading-concepts .concept-picker { grid-template-columns: repeat(2, 1fr); }
    #opening-loading-concepts .preview { aspect-ratio: auto; min-height: 345px; }
    #opening-loading-concepts .art { width: 88%; }
    #opening-loading-concepts .battery { width: 180px; height: 82px; }
    #opening-loading-concepts .battery::after { top: 24px; }
    #opening-loading-concepts .timeline-year { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #opening-loading-concepts *, #opening-loading-concepts *::before, #opening-loading-concepts *::after { animation: none !important; transition: none !important; }
  }
</style>

  <div class="preview-footer"><span class="selected-label">01 · 배터리 충전</span><button class="replay" type="button">다시 재생</button></div>
</div>
<script>
(() => {
  const root = document.getElementById('opening-loading-concepts');
  const buttons = [...root.querySelectorAll('[data-concept]')];
  const artPanels = [...root.querySelectorAll('[data-art]')];
  const cells = [...root.querySelectorAll('.battery span')];
  const stops = [...root.querySelectorAll('.timeline-stop')];
  const screen = root.querySelector('.loading-screen');
  const destination = root.querySelector('.map-destination');
  const start = root.querySelector('.start-control');
  const status = root.querySelector('[data-status]');
  const percent = root.querySelector('.percent');
  const bigNumber = root.querySelector('[data-big-number]');
  const label = root.querySelector('.selected-label');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const appearance = { duration: 3, accent: '#2864df' };
  const runtime = { concept: 'battery', animation: 0, startedAt: 0, complete: false };
  const FULL_PERCENT = 100;
  const MILLISECONDS = 1000;
  const PIN_TRAVEL = 28;
  const LOADING_TEXT = '발표 준비 중';
  const READY_TEXT = '준비 완료';
  function paint(progress) {
    const value = Math.round(progress * FULL_PERCENT);
    root.dataset.progress = String(value);
    root.style.setProperty('--loading-progress', progress);
    root.style.setProperty('--timeline-progress', Math.min(1, progress * 1.2));
    root.style.setProperty('--ground-scale', .7 + progress * .3);
    root.style.setProperty('--ground-opacity', .35 + progress * .65);
    root.style.setProperty('--pin-opacity', Math.min(1, .15 + progress * 2));
    root.style.setProperty('--pin-offset', `${-PIN_TRAVEL * (1 - Math.min(1, progress * 1.4))}px`);
    cells.forEach((cell, index) => cell.classList.toggle('is-filled', progress >= (index + 1) / cells.length));
    stops.forEach((stop, index) => stop.classList.toggle('is-active', progress >= (index + 1) / stops.length));
    percent.textContent = `${value}%`;
    bigNumber.textContent = String(value);
  }
  function finish() {
    paint(1);
    runtime.complete = true;
    root.dataset.state = 'ready';
    status.textContent = READY_TEXT;
    start.disabled = false;
  }
  function tick(timestamp) {
    if (!root.isConnected) return;
    const elapsed = timestamp - runtime.startedAt;
    const progress = Math.min(elapsed / (appearance.duration * MILLISECONDS), 1);
    paint(1 - (1 - progress) ** 1.4);
    if (progress >= 1) return finish();
    runtime.animation = requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(runtime.animation);
    runtime.complete = false;
    root.dataset.state = 'loading';
    screen.hidden = false;
    destination.hidden = true;
    start.disabled = true;
    status.textContent = LOADING_TEXT;
    percent.hidden = runtime.concept === 'minimal';
    root.style.setProperty('--loader-blue', appearance.accent);
    artPanels.forEach(panel => { panel.hidden = panel.dataset.art !== runtime.concept; });
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.concept === runtime.concept)));
    label.textContent = buttons.find(button => button.dataset.concept === runtime.concept).textContent;
    paint(0);
    if (motion.matches) return finish();
    runtime.startedAt = performance.now();
    runtime.animation = requestAnimationFrame(tick);
  }
  buttons.forEach(button => button.addEventListener('click', () => {
    runtime.concept = button.dataset.concept;
    play();
  }));
  root.querySelector('.replay').addEventListener('click', play);
  start.addEventListener('click', () => {
    if (!runtime.complete) return;
    screen.hidden = true;
    destination.hidden = false;
    root.dataset.state = 'started';
  });
  motion.addEventListener('change', play);
  play();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: play });
    tweak.addSlider(appearance, 'duration', { label: '로딩 시간', min: 1.5, max: 5, step: .5, unit: '초' });
    tweak.addColorPicker(appearance, 'accent', { label: '강조 색상', reference: '--loader-blue' });
  }
})();
</script>
